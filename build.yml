name: Build ClickRepeater

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 28.2.13676358

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure (arm64-v8a)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static

      - name: Build and package
        run: cmake --build build-android --target levi_package

      - name: Verify package
        run: |
          cd build-android
          unzip -l ClickRepeater.levipack
          unzip -o ClickRepeater.levipack -d verify
          file verify/click_repeater/libclick_repeater.so | tee /dev/stderr | grep -q "ARM aarch64"
          cat verify/click_repeater/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ClickRepeater
          path: build-android/ClickRepeater.levipack
          if-no-files-found: error
